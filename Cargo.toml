[package]
name = "spark-inquisitor"
version = "0.2.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "Native Rust GitHub Action and CLI for diff auditing, zero-telemetry enforcement, and automated repository triage"
license = "SRCL-1.0"
repository = "https://github.com/aien-dev/spark-inquisitor"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.2"
uuid = { version = "1.8", features = ["v4"] }
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
aien-protocol-types = { path = "../aien-protocols/crates/aien-protocol-types" }
aien-evaluation-protocol = { path = "../aien-protocols/crates/aien-evaluation-protocol" }
aien-probe = { path = "../aien-protocols/crates/aien-probe" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
