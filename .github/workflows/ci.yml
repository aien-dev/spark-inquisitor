name: Sovereign CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify Inquisitor Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Install Inquisitor to Path
        run: sudo cp target/release/spark-inquisitor /usr/local/bin/

      - name: Verify Composite Action Execution
        uses: ./
        with:
          command: doctor
