name: "Sovereign Inquisitor"
description: "Ultra-fast compiled native Rust GitHub Action for diff auditing, zero-telemetry enforcement, and automated triage without Node.js CPU bloat."
author: "Drake Stapleton <aien@aienos.com> & AIEN <aien@aienos.com>"

inputs:
  command:
    description: "Inquisitor command: review, triage-issue, interview, audit, evaluate, probe, or doctor"
    required: true
    default: "review"
  diff:
    description: "Path to git diff file"
    required: false
    default: "pr.diff"
  author:
    description: "GitHub username of PR or issue author"
    required: false
    default: "contributor"
  pr:
    description: "Pull request number"
    required: false
    default: "0"
  title:
    description: "Pull request or issue title"
    required: false
    default: "Contribution"
  output-comment:
    description: "Path to write generated markdown comment"
    required: false
    default: "comment.md"
  output-labels:
    description: "Path to write comma-separated labels"
    required: false
    default: "labels.txt"

runs:
  using: "composite"
  steps:
    - name: Run Sovereign Inquisitor
      shell: bash
      run: |
        case "${{ inputs.command }}" in
          doctor)
            spark-inquisitor doctor
            ;;
          probe)
            spark-inquisitor probe \
              --diff "${{ inputs.diff }}" \
              --output "${{ inputs.output-comment }}"
            ;;
          review)
            spark-inquisitor review \
              --diff "${{ inputs.diff }}" \
              --author "${{ inputs.author }}" \
              --pr "${{ inputs.pr }}" \
              --title "${{ inputs.title }}" \
              --output "${{ inputs.output-comment }}" \
              --output-labels "${{ inputs.output-labels }}"
            ;;
          triage-issue)
            spark-inquisitor triage-issue \
              --author "${{ inputs.author }}" \
              --issue "${{ inputs.pr }}" \
              --title "${{ inputs.title }}" \
              --body "${{ inputs.diff }}" \
              --output-comment "${{ inputs.output-comment }}" \
              --output-labels "${{ inputs.output-labels }}"
            ;;
          interview)
            spark-inquisitor interview \
              --author "${{ inputs.author }}" \
              --pr "${{ inputs.pr }}" \
              --title "${{ inputs.title }}"
            ;;
          audit)
            spark-inquisitor audit \
              --diff "${{ inputs.diff }}"
            ;;
          evaluate)
            spark-inquisitor evaluate \
              --testimony "${{ inputs.diff }}" \
              --author "${{ inputs.author }}" \
              --output-comment "${{ inputs.output-comment }}" \
              --output-labels "${{ inputs.output-labels }}"
            ;;
          *)
            spark-inquisitor "${{ inputs.command }}"
            ;;
        esac
